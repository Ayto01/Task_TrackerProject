<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task tracker</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/script.js"></script>
</head>
<body>

<section id="login-view" hidden>
    <h1>Sign in</h1>



    <form id="login-form" action="/api/auth/login" method="post">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Sign in</button>
        <p><a href="/register.html">Create an account</a></p>
    </form>

    <p id="login-status" role="status"></p>
</section>


<section id="tasks-view" hidden>
    <h1>My Tasks</h1>

    <form id="task-form">
      <label for="task">New Task</label>
    <input type="text" id="task">


        <button type="submit">Add</button>
        <button id="sign-out-button" type="button">Sign out</button>
        <p id="task-status" role="status"></p>


  
</form>
    <button id="load-sample-tasks" type="button">Reload tasks</button>
    <p id="api-status" role="status"></p>
    <div class="task-filter">
        <label for="task-filter">Show tasks</label>
        <select id="task-filter">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
        </select>
    </div>

  <ul id="task-list"></ul>

</section>

  


    
</body>
</html>
